name: keepalive

# GitHub은 public repo에 60일간 활동이 없으면 스케줄 workflow를 자동으로 끈다.
# 매월 1일 빈 커밋을 push해서 repo 활동을 유지한다.

on:
  schedule:
    - cron: "0 0 1 * *" # 매월 1일 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%F)"
          git push
